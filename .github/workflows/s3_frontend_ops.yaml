name: S3 Bucket Updates and Cloudfront Cache Invalidation
on: 
    push:
        branches:
            - dev
    workflow_dispatch:
permissions:
    id-token: write   # This is required for requesting the JWT
    contents: read    # This is required for actions/checkout
jobs:
    AuthenticateToAWS:
        runs-on: ubuntu-latest
        steps: 
            - name: Configure AWS Credentials
              id: AWS-creds-auth
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-region: ${{secrets.AWS_DEFAULT_REGION}}
                  role-to-assume: ${{secrets.CLOUD_RESUME_AUTOMATION_ROLE}}
                  role-session-name: GiHubActions-frontend-workflow_via_OIDC
                  retry-max-attempts: 3
                  output-credentials: true
            - name: test connection to AWS resources
              run: |
                aws s3api list-objects --bucket odera-cloud-resume-testing --max-items 1
    Test:
        needs: AuthenticateToAWS
        runs-on: ubuntu-latest
        steps:
            - name: Create working directory
              run: mkdir ~/s3objects
            - name: Get the code from the repo
              uses: actions/checkout@v4
              with:
                path: ~/s3objects
            - name: Assume aws sts role
              id: AWS-creds-test
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-region: ${{secrets.AWS_DEFAULT_REGION}}
                role-to-assume: ${{secrets.CLOUD_RESUME_AUTOMATION_ROLE}}
                role-session-name: GiHubActions-frontend-workflow_via_OIDC
                retry-max-attempts: 3
                output-credentials: true
            - name: Upload the new objects to the s3 test bucket
              run: |
                cd ~/s3objects
                aws s3 sync . s3://odera-cloud-resume-testing
            - name: test the code hosted from the testing bucket
              run: |
                ls -a
                pytest
    
    

    

