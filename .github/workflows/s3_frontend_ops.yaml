name: S3 Bucket Updates and Cloudfront Cache Invalidation
on: 
    push:
        branches:
            - dev
    workflow_dispatch:
permissions:
    id-token: write   # This is required for requesting the JWT
    contents: read    # This is required for actions/checkout
jobs:
    AuthenticateToAWSandGetCode:
        runs-on: macos-latest
        steps: 
            - name: Get the code from the repo
              uses: actions/checkout@v4
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-region: ${{secrets.AWS_DEFAULT_REGION}}
                  role-to-assume: arn:aws:iam::755341967779:role/GitHub-IdP-Role-Tgr2bLzqyX9p
                  role-session-name: GiHubActions-frontend-workflow_via_OIDC
                  retry-max-attempts: 3
            # Hello from AWS: WhoAmI
            - name: test connection to AWS resources - Sts GetCallerIdentity
              run: |
                    aws sts get-caller-identity
            - name: test connection to AWS resources
              run: |
                aws s3api list-objects --bucket odera-cloud-resume --max-items 1

