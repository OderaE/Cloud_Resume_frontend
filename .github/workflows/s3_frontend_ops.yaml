name: S3 Bucket Updates and Cloudfront Cache Invalidation
on: 
    push:
        branches:
            - dev
    workflow_dispatch:
permissions:
    id-token: write   # This is required for requesting the JWT
    contents: read    # This is required for actions/checkout
    pull-requests: write 
jobs:
    AuthenticateToAWS:
        runs-on: ubuntu-latest
        steps: 
            - name: Configure AWS Credentials
              id: AWS-creds-auth
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-region: ${{secrets.AWS_DEFAULT_REGION}}
                  role-to-assume: ${{secrets.CLOUD_RESUME_AUTOMATION_ROLE}}
                  role-session-name: GiHubActions-frontend-workflow_via_OIDC
                  retry-max-attempts: 3
                  output-credentials: true
            - name: test connection to AWS resources
              run: |
                aws s3api list-objects --bucket odera-cloud-resume-testing --max-items 1
    Test:
        needs: AuthenticateToAWS
        runs-on: ubuntu-latest
        steps:
            - name: Get the code from the repo
              uses: actions/checkout@v4
              with:
                ref: dev
            - name: Assume aws sts role
              id: AWS-creds-test
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-region: ${{secrets.AWS_DEFAULT_REGION}}
                role-to-assume: ${{secrets.CLOUD_RESUME_AUTOMATION_ROLE}}
                role-session-name: GiHubActions-frontend-workflow_via_OIDC
                retry-max-attempts: 3
                output-credentials: true
            - name: Upload the new objects to the s3 test bucket
              run: |
                aws s3 sync . s3://odera-cloud-resume-testing
            - name: Cache dependencies - pytest in this case
              uses: actions/cache@v4
              with:
                path: ./tests/unit/.pytest_cache
                key: pytest-caching-${{ hashFiles('./tests/unit/.pytest_cache/CACHEDIR.TAG') }}
            - name: install pytest
              run: pip install pytest
            - name: test the code hosted from the testing bucket
              run: |
                cd ./tests/unit
                pytest
    AcceptCode:
        needs: Test
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Get the successfully tested code
              uses: actions/checkout@v4
              with:
                ref: dev
                fetch-depth: 0 #Makes all branches available from checkout
            - name: Scrub the code of dev keywords
              run: |
                sed -i 's|test|count|g' ./assets/js/visitorApi.js
                sed -i 's|oderalabs.link\/admin-test\/index.html|oderalabs.link\/|g' ./tests/unit/functionality_security_test.py
                sed -i 's|oderalabs.link\/test|oderalabs.link\/count|g' ./tests/unit/functionality_security_test.py
            - name: Commit files
              run: |
                git config --local user.email ${{secrets.USER_EMAIL}}
                git config --local user.name "baex3"
                git commit -a -m "pushing commit from Actions CI: ${{hashFiles('./')}}"
                git checkout main
                git merge dev
            - name: Push changes
              uses: ad-m/github-push-action@master
              with:
                  branch: main
                  github_token: ${{ secrets.GITHUB_TOKEN }}
    DeployToProdBucket:
        needs: AcceptCode
        runs-on: ubuntu-latest
        steps:
            - name: Get code from main branch
              uses: actions/checkout@v4
              with:
                ref: main
            - name: Assume aws sts role
              id: AWS-creds-prod
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-region: ${{secrets.AWS_DEFAULT_REGION}}
                role-to-assume: ${{secrets.CLOUD_RESUME_AUTOMATION_ROLE}}
                role-session-name: GiHubActions-frontend-workflow_via_OIDC_prod
                retry-max-attempts: 3
                output-credentials: false
            - name: Upload the new objects to the s3 test bucket and maintenance page
              run: |
                  aws s3 sync . s3://odera-cloud-resume --exclude "maintenance.html"
                  aws s3 sync . s3://error-pages-oe-engr --exclude "index.html" --exclude ".github/*" --exclude "tests/*" --exclude "images/*"
            - name: Invalidate CloudFront cache
              run: aws cloudfront create-invalidation --distribution-id ${{secrets.CF_DISTRIBUTION_ID}} --paths '/*'
            - name: Pull cached dependencies stored in GH Actions Workflow
              uses: actions/cache@v4
              with:
                path: ./tests/unit/.pytest_cache
                key: pytest-caching-${{ hashFiles('./tests/unit/.pytest_cache/CACHEDIR.TAG') }}
            - name: Install pytest (from workflow cache) and test the deployment
              run: pip install pytest
            - name: test the production code hosted from the testing bucket
              run: |
                    cd ./tests/unit
                    pytest
            
                

    
    

    

